aid: democracy-earth
name: Democracy Earth
description: Democracy Earth Foundation is a Y Combinator- and Fast Forward-backed
  501(c)(3) nonprofit building free, open-source, blockchain-based software for incorruptible
  digital governance and voting. Its flagship Sovereign application is a liquid-democracy
  platform that lets communities vote directly on issues or delegate their voting power
  to trusted peers over a decentralized, censorship-resistant network. The Foundation
  also develops self-sovereign identity (a proof-of-humanity protocol), a universal
  basic income token, and a minimal quadratic-voting DAO, publishing all of its work
  as open-source repositories rather than as a commercial, hosted API. Democracy Earth
  is a protocol-first, decentralized project without a hosted REST API or developer program.
